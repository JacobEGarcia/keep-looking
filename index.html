<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KEEP LOOKING</title><style>
:root{--ink:#171515;--paper:#f2ead9;--acid:#e6ff35;--blue:#3ebbc7;--red:#ed513f}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);font-family:Arial,Helvetica,sans-serif;color:var(--paper);touch-action:none}canvas{display:block;width:100%;height:100%}button{font:700 12px/1 Arial;letter-spacing:.16em;border:0;border-radius:0;padding:15px 20px;background:var(--acid);color:var(--ink);cursor:pointer;text-transform:uppercase}#ui{position:fixed;inset:0;pointer-events:none}#top{position:absolute;left:20px;right:20px;top:max(18px,env(safe-area-inset-top));display:flex;align-items:flex-start;justify-content:space-between;gap:20px;text-transform:uppercase;font-size:11px;font-weight:bold;letter-spacing:.14em}.brand{line-height:1.3}.brand b{font-size:17px;letter-spacing:-.03em}.score{text-align:right;line-height:1.55}.bar{width:112px;height:3px;background:#f2ead933;margin-top:5px}.bar i{height:100%;display:block;background:var(--acid);width:0}.card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#171515e8;pointer-events:auto}.panel{width:min(560px,calc(100% - 36px));border-top:1px solid #f2ead955;border-bottom:1px solid #f2ead955;padding:30px 0 34px}.eyebrow{font-size:10px;font-weight:bold;letter-spacing:.22em;text-transform:uppercase;color:var(--acid);margin-bottom:18px}h1{font-size:clamp(50px,13vw,102px);line-height:.76;letter-spacing:-.08em;margin:0 0 26px;text-transform:uppercase;max-width:500px}p{font-size:15px;line-height:1.5;max-width:420px;margin:0 0 22px;color:#f2ead9c8}.rules{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#f2ead930;border:1px solid #f2ead930;margin:24px 0}.rules div{background:var(--ink);padding:15px;font-size:11px;line-height:1.35;text-transform:uppercase;letter-spacing:.08em}.rules b{color:var(--acid)}.hidden{display:none!important}#caption{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:20px;font-size:12px;font-weight:bold;letter-spacing:.12em;text-transform:uppercase;background:var(--paper);color:var(--ink);padding:10px 12px;max-width:calc(100% - 40px);opacity:0;transform:translateY(8px);transition:.2s}#caption.show{opacity:1;transform:none}#flash{position:absolute;inset:0;background:var(--paper);opacity:0;transition:opacity .12s}.resultLine{font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin:20px 0 26px;color:#f2ead9a8}.resultLine b{color:var(--acid)}@media(max-width:600px){#top{left:14px;right:14px}.bar{width:82px}.panel{padding-top:24px}.rules{grid-template-columns:1fr}h1{font-size:62px}.rules div{padding:12px}p{font-size:14px}}
</style></head><body><canvas id="c"></canvas><div id="ui"><div id="top"><div class="brand"><b>KEEP LOOKING</b><br><span id="place">LAST BUS / 23:48</span></div><div class="score"><span id="found">0 / 7 MOMENTS</span><br><span id="time">60.0</span><div class="bar"><i id="progress"></i></div></div></div><div id="caption"></div><div id="flash"></div><section id="intro" class="card"><div class="panel"><div class="eyebrow">A game about being where you are</div><h1>Keep<br>Looking</h1><p>The last bus is late. Small things are happening everywhere. Your phone would rather have you somewhere else.</p><div class="rules"><div><b>Move</b><br>Guide your attention</div><div><b>Hold</b><br>Stay on a flickering detail</div></div><button id="start">Put the phone down</button></div></section><section id="end" class="card hidden"><div class="panel"><div class="eyebrow">The bus arrived</div><h1 id="endTitle">You were<br>here.</h1><div class="resultLine" id="result"></div><button id="again">Look again</button></div></section></div><script>
const C=document.querySelector('#c'),X=C.getContext('2d');let W,H,D=1,t=0,running=false,remain=60,found=0,last=0,hold=0,target=null,shake=0;
const mouse={x:0,y:0,down:false}; const palette=['#171515','#f2ead9','#e6ff35','#3ebbc7','#ed513f','#7666b3'];
const moments=[
{x:.14,y:.57,r:.052,need:1.15,text:'A moth worrying the streetlight.',seen:false},
{x:.82,y:.61,r:.060,need:1.3,text:'Someone saving half a sandwich.',seen:false},
{x:.54,y:.38,r:.048,need:1.1,text:'Rain caught in a spider web.',seen:false},
{x:.29,y:.75,r:.055,need:1.4,text:'Two shoes keeping the same rhythm.',seen:false},
{x:.70,y:.29,r:.054,need:1.25,text:'A window goes dark. Goodnight.',seen:false},
{x:.43,y:.68,r:.052,need:1.25,text:'A coin spinning under the bench.',seen:false},
{x:.91,y:.45,r:.045,need:1.2,text:'The driver waves from far away.',seen:false}
];
const notices=[]; function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function rnd(n){return Math.sin(n*912.31)*43758.5453%1}function rect(x,y,w,h,c){X.fillStyle=c;X.fillRect(x,y,w,h)}function line(x1,y1,x2,y2,c,w=2){X.strokeStyle=c;X.lineWidth=w;X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);X.stroke()}function poly(a,c){X.fillStyle=c;X.beginPath();X.moveTo(a[0][0],a[0][1]);for(let i=1;i<a.length;i++)X.lineTo(a[i][0],a[i][1]);X.closePath();X.fill()}
function scene(){rect(0,0,W,H,'#789b87'); let ground=H*.69;rect(0,ground,W,H-ground,'#242428');
// compressed sky blocks
for(let i=0;i<18;i++){let xx=i*W/18,hh=(i%3)*5;rect(xx,H*.17+hh,W/18+1,H*.28,['#d9c9a8','#e5b36e','#ce8c6f'][i%3])}
// apartments
rect(W*.57,H*.15,W*.43,H*.48,'#633f42');for(let r=0;r<4;r++)for(let q=0;q<5;q++){let on=((r*5+q+Math.floor(t*.5))%7)<3;rect(W*(.60+q*.078),H*(.20+r*.095),W*.042,H*.055,on?'#e7d44d':'#25232a')}
// shop
rect(0,H*.32,W*.35,H*.37,'#d75543');rect(W*.025,H*.39,W*.29,H*.22,'#77c6c4');line(W*.17,H*.39,W*.17,H*.61,'#171515',4);rect(W*.04,H*.335,W*.25,H*.035,'#f0eadb');X.fillStyle='#171515';X.font=`bold ${Math.max(11,W*.011)}px Arial`;X.fillText('NIGHT SHOP',W*.055,H*.36);
// wet street reflections
for(let i=0;i<14;i++){let x=(i*139)%W;rect(x,ground+20+(i%4)*18,34+(i%3)*22,3,palette[2+i%4])}
// shelter
rect(W*.36,H*.36,W*.29,H*.02,'#171515');line(W*.38,H*.36,W*.38,H*.68,'#171515',5);line(W*.64,H*.36,W*.64,H*.68,'#171515',5);rect(W*.39,H*.43,W*.23,H*.18,'#d3d0c6');
// bench + seated person
rect(W*.40,H*.60,W*.20,H*.025,'#171515');line(W*.43,H*.62,W*.42,H*.68,'#171515',4);line(W*.57,H*.62,W*.58,H*.68,'#171515',4);X.fillStyle='#3ebbc7';X.beginPath();X.arc(W*.51,H*.49,Math.min(W,H)*.025,0,7);X.fill();poly([[W*.47,H*.53],[W*.55,H*.52],[W*.58,H*.61],[W*.46,H*.60]],'#7666b3');line(W*.50,H*.55,W*.45,H*.61,'#e2a084',8);
// foreground figures
poly([[W*.22,H*.54],[W*.29,H*.54],[W*.31,H*.76],[W*.21,H*.76]],'#e6ff35');X.fillStyle='#d58e72';X.beginPath();X.arc(W*.255,H*.50,Math.min(W,H)*.032,0,7);X.fill();
poly([[W*.76,H*.50],[W*.83,H*.52],[W*.86,H*.73],[W*.75,H*.74]],'#3ebbc7');X.fillStyle='#9e6553';X.beginPath();X.arc(W*.79,H*.47,Math.min(W,H)*.031,0,7);X.fill();
// rain / scan breaks
X.globalAlpha=.35;for(let i=0;i<55;i++){let x=((i*83+t*55)% (W+80))-40,y=(i*137)%H;line(x,y,x-7,y+16,'#f2ead9',1)}X.globalAlpha=1;
// moments flicker
moments.forEach((m,i)=>{if(m.seen)return;let pulse=.5+.5*Math.sin(t*(2.8+i*.23)+i);if(pulse>.55){X.strokeStyle='#e6ff35';X.globalAlpha=.25+pulse*.45;X.lineWidth=1;X.beginPath();X.arc(m.x*W,m.y*H,m.r*Math.min(W,H)*(1+pulse*.15),0,7);X.stroke();X.globalAlpha=1}})
}
function noise(){if(!running)return;let intensity=Math.max(0,1-remain/60);X.globalCompositeOperation='difference';for(let i=0;i<Math.floor(intensity*16);i++){let y=Math.random()*H,h=2+Math.random()*9;X.drawImage(C,0,y*D,W*D,h*D,(Math.random()-.5)*24,y,W,h)}X.globalCompositeOperation='source-over';}
function notifications(dt){if(running&&Math.random()<dt*(.28+(.9-remain/70))){notices.push({x:W+20,y:80+Math.random()*(H-180),w:Math.min(260,W*.64),life:5,text:['TRENDING NOW','3 NEW MESSAGES','YOU MISSED THIS','STILL WATCHING?','PEOPLE ARE TALKING'][Math.floor(Math.random()*5)]})}notices.forEach(n=>{n.life-=dt;n.x+=(Math.max(W-n.w-16,n.x)-n.x)*dt*4;let a=Math.min(1,n.life);X.globalAlpha=Math.max(0,a);rect(n.x,n.y,n.w,58,'#171515');X.strokeStyle='#f2ead9';X.strokeRect(n.x+.5,n.y+.5,n.w-1,57);rect(n.x+10,n.y+10,7,38,'#ed513f');X.fillStyle='#f2ead9';X.font='bold 11px Arial';X.fillText(n.text,n.x+30,n.y+24);X.font='10px Arial';X.fillStyle='#f2ead999';X.fillText('swipe to leave this moment',n.x+30,n.y+42);X.globalAlpha=1});for(let i=notices.length-1;i>=0;i--)if(notices[i].life<=0)notices.splice(i,1)}
function gaze(dt){if(!running)return;target=null;let md=Math.min(W,H);for(const m of moments){if(!m.seen&&Math.hypot(mouse.x-m.x*W,mouse.y-m.y*H)<m.r*md){target=m;break}}if(target&&mouse.down){hold+=dt;let p=Math.min(1,hold/target.need);X.strokeStyle='#e6ff35';X.lineWidth=5;X.beginPath();X.arc(mouse.x,mouse.y,34,-Math.PI/2,-Math.PI/2+p*Math.PI*2);X.stroke();if(p>=1){target.seen=true;found++;hold=0;document.querySelector('#found').textContent=`${found} / 7 MOMENTS`;document.querySelector('#progress').style.width=(found/7*100)+'%';say(target.text);document.querySelector('#flash').style.opacity=.34;setTimeout(()=>document.querySelector('#flash').style.opacity=0,80);if(found===7)setTimeout(finish,700)}}else hold=Math.max(0,hold-dt*2);X.strokeStyle=target?'#e6ff35':'#f2ead9';X.lineWidth=1;X.beginPath();X.arc(mouse.x,mouse.y,18,0,7);X.stroke();line(mouse.x-25,mouse.y,mouse.x-12,mouse.y,X.strokeStyle);line(mouse.x+12,mouse.y,mouse.x+25,mouse.y,X.strokeStyle)}
function say(s){let e=document.querySelector('#caption');e.textContent=s;e.classList.add('show');clearTimeout(say.to);say.to=setTimeout(()=>e.classList.remove('show'),2500)}
function loop(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;t+=dt;scene();noise();notifications(dt);gaze(dt);if(running){remain-=dt;document.querySelector('#time').textContent=Math.max(0,remain).toFixed(1);if(remain<=0)finish()}requestAnimationFrame(loop)}requestAnimationFrame(loop);
function start(){moments.forEach(m=>m.seen=false);notices.length=0;found=0;remain=60;hold=0;running=true;document.querySelector('#found').textContent='0 / 7 MOMENTS';document.querySelector('#progress').style.width='0';document.querySelector('#intro').classList.add('hidden');document.querySelector('#end').classList.add('hidden')}
function finish(){if(!running)return;running=false;let title=found===7?'You were<br>here.':found>=4?'Almost<br>present.':'Gone<br>elsewhere.';document.querySelector('#endTitle').innerHTML=title;document.querySelector('#result').innerHTML=`You noticed <b>${found} of 7</b> small things before the bus came.`;document.querySelector('#end').classList.remove('hidden')}
function point(e){let p=e.touches?e.touches[0]:e;mouse.x=p.clientX;mouse.y=p.clientY}addEventListener('pointermove',point);addEventListener('pointerdown',e=>{point(e);mouse.down=true});addEventListener('pointerup',()=>mouse.down=false);addEventListener('pointercancel',()=>mouse.down=false);document.querySelector('#start').onclick=start;document.querySelector('#again').onclick=start;
</script></body></html>
